<!-- Lumia emblem. The source art is a raster line-drawing, so this carries a
     64px bitmap rather than paths - 64 covers a 32px tab at 2x, which is the
     largest a browser asks this file for. The PNG siblings are generated from
     the same master; regenerate all three together if the logo changes.
     Fine linework this dense cannot survive 16px, so the mark is cropped to
     84-96% of the plate to give it every pixel available. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="Lumia International Spa">
  <image x="0" y="0" width="64" height="64" xlink:href="data:image/png;base64,"/>
</svg>