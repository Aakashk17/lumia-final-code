<!-- Lumia lotus mark. Raster source, so this carries a 64px bitmap rather than
     paths - 64 covers a 32px tab at 2x, the largest a browser asks it for.
     lumia_favicon-32.png and apple-touch-icon.png come off the same master;
     regenerate all three together if the mark changes.
     The dark plate is not decoration: the gold is #FFF79A, near-white, which
     would all but vanish on a light tab strip. On #302310 it reads at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="Lumia International Spa">
  <image x="0" y="0" width="64" height="64" xlink:href="data:image/png;base64,"/>
</svg>